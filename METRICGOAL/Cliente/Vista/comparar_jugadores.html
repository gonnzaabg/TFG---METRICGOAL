<!DOCTYPE html>

<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar Jugadores - METRICGOAL</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <style>
        .ts-control {
            background-color: #1e293b !important;
            color: white !important;
            border: 1px solid #334155 !important;
        }
        .ts-dropdown {
            background-color: #1e293b !important;
            color: white !important;
        }
        .ts-dropdown .active {
            background-color: #800020 !important;
            color: white !important;
        }
    </style>
</head>
<body class="comparar-page">

    <header>
        <div class="logo">MG</div>
        <div class="header-sep"></div>
        <nav>
            <a href="/dashboard">Mi Equipo</a>
            <a href="/informes">Informes</a>
            <a href="/comparar_jugadores" class="active">Comparar Jugadores</a>
        </nav>
        <div class="header-right">
            <span class="badge-temporada">2025/26</span>
            <button class="btn-salir" onclick="logout()">Cerrar Sesión</button>
        </div>
    </header>

    <main class="container">

        <section class="controles-comparacion">
            <div class="control-grupo">
                <label for="select-canterano">Selecciona al canterano</label>
                <select id="select-canterano" placeholder="Escribe para buscar...">
                    <option value="">Seleccionar...</option>
                </select>
            </div>
            <div class="control-grupo">
                <label for="select-profesional">Busca al profesional</label>
                <select id="select-profesional" placeholder="Escribe para buscar (ej: Lewandowski...)"></select>
            </div>
        </section>

        <button class="btn-exportar" onclick="realizarComparacion()">Comparar Jugadores</button>

        <!-- CONTENEDOR DE LAS TRES MÉTRICAS (oculto hasta comparar) -->
        <section class="metricas-grid" id="seccion-metricas" style="display:none; flex-direction:column; align-items:center; gap:30px;">

            <!-- 1. RADAR -->
            <div class="caja-metrica" style="width:100%; max-width:900px; min-height:550px; display:flex; flex-direction:column; align-items:center; height:auto; padding:24px;">
                <h3 class="titulo-caja">Gráfico Radar</h3>
                <div id="grafico-radar" style="width:100%; height:500px;"></div>
            </div>

            <!-- 2. BARRAS HORIZONTALES -->
            <div class="caja-metrica" style="width:100%; max-width:900px; height:auto; padding:24px; flex-direction:column; align-items:flex-start;">
                <h3 class="titulo-caja">Comparativa por Métrica</h3>
                <div id="grafico-barras" style="width:100%; height:420px;"></div>
            </div>

            <!-- 3. TABLA RESUMEN -->
            <div class="caja-metrica" style="width:100%; max-width:900px; height:auto; padding:24px; flex-direction:column; align-items:flex-start;">
                <h3 class="titulo-caja">Resumen Estadístico</h3>
                <div class="tabla-wrapper">
                    <table class="tabla-resumen">
                        <thead>
                            <tr>
                                <th>Métrica</th>
                                <th id="th-canterano">Canterano</th>
                                <th>Diferencia</th>
                                <th id="th-profesional">Profesional</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body"></tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <script>
        let buscador;

        document.addEventListener('DOMContentLoaded', async () => {
            buscador = new TomSelect("#select-canterano", {
                create: false,
                sortField: { field: "text", direction: "asc" }
            });
            await cargarJugadoresSelect();
        });

        async function cargarJugadoresSelect() {
            const idEquipo = localStorage.getItem('idEquipo');
            if (!idEquipo) return;
            try {
                const response = await fetch(`/obtener_jugadores?id_equipo=${idEquipo}`);
                const jugadores = await response.json();
                jugadores.forEach(j => {
                    buscador.addOption({
                        value: j.id_jugador,
                        text: `${j.nombre} ${j.apellidos || ''} (${j.posicion})`
                    });
                });
            } catch (error) {
                console.error("Error al cargar jugadores:", error);
            }
        }

        async function realizarComparacion() {
            const idCanterano = document.getElementById('select-canterano').value;
            const nombreProfesional = document.getElementById('select-profesional').value;

            if (!idCanterano || !nombreProfesional) {
                alert("Por favor, selecciona ambos jugadores");
                return;
            }

            try {
                const response = await fetch(`/api/comparar_jugadores?id_canterano=${idCanterano}&nombre_profesional=${encodeURIComponent(nombreProfesional)}`);
                const data = await response.json();

                if (data.error) { alert("Error: " + data.error); return; }

                const seccion = document.getElementById('seccion-metricas');
                seccion.style.display = 'flex';

                document.getElementById('th-canterano').textContent = data.canterano.nombre;
                document.getElementById('th-profesional').textContent = data.profesional.nombre;

                // ── Normalización para el radar (0-100) ──
                const valCan = [], valProf = [];
                data.labels.forEach((_, i) => {
                    const vC = data.canterano.valores[i];
                    const vP = data.profesional.valores[i];
                    const max = Math.max(vC, vP);
                    valCan.push(max > 0 ? (vC / max) * 100 : 0);
                    valProf.push(max > 0 ? (vP / max) * 100 : 0);
                });

                // ── 1. RADAR ──
                Plotly.newPlot('grafico-radar', [
                    {
                        type: 'scatterpolar', r: valCan, theta: data.labels, fill: 'toself',
                        name: data.canterano.nombre,
                        customdata: data.canterano.valores,
                        hovertemplate: `<b>${data.canterano.nombre}</b><br>%{theta}: <b>%{customdata}</b><extra></extra>`,
                        line: { color: '#3b82f6', width: 3 }, fillcolor: 'rgba(59,130,246,0.3)'
                    },
                    {
                        type: 'scatterpolar', r: valProf, theta: data.labels, fill: 'toself',
                        name: data.profesional.nombre,
                        customdata: data.profesional.valores,
                        hovertemplate: `<b>${data.profesional.nombre}</b><br>%{theta}: <b>%{customdata}</b><extra></extra>`,
                        line: { color: '#800020', width: 3 }, fillcolor: 'rgba(128,0,32,0.3)'
                    }
                ], {
                    polar: {
                        radialaxis: { visible: true, showticklabels: false, gridcolor: "rgba(255,255,255,0.1)", range: [0, 105] },
                        angularaxis: { gridcolor: "#334155", color: "white", tickfont: { size: 12 }, rotation: 90 },
                        bgcolor: "rgba(30,41,59,0.5)"
                    },
                    hovermode: 'closest',
                    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
                    font: { color: "white" }, showlegend: true,
                    legend: { orientation: "h", y: -0.2, x: 0.5, xanchor: "center" },
                    margin: { t: 40, b: 40, l: 80, r: 80 }
                }, { responsive: true });

                // ── 2. BARRAS HORIZONTALES ──
                Plotly.newPlot('grafico-barras', [
                    {
                        type: 'bar', orientation: 'h',
                        name: data.canterano.nombre,
                        x: data.canterano.valores,
                        y: data.labels,
                        marker: { color: 'rgba(59,130,246,0.85)', line: { color: '#3b82f6', width: 1.5 } },
                        hovertemplate: `<b>${data.canterano.nombre}</b>: %{x}<extra></extra>`
                    },
                    {
                        type: 'bar', orientation: 'h',
                        name: data.profesional.nombre,
                        x: data.profesional.valores,
                        y: data.labels,
                        marker: { color: 'rgba(128,0,32,0.85)', line: { color: '#800020', width: 1.5 } },
                        hovertemplate: `<b>${data.profesional.nombre}</b>: %{x}<extra></extra>`
                    }
                ], {
                    barmode: 'group',
                    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
                    font: { color: "white", size: 12 },
                    xaxis: { gridcolor: "rgba(255,255,255,0.08)", color: "white", zeroline: false },
                    yaxis: { color: "white", automargin: true, tickfont: { size: 13 } },
                    legend: { orientation: "h", y: -0.18, x: 0.5, xanchor: "center" },
                    margin: { t: 20, b: 60, l: 140, r: 30 }
                }, { responsive: true });

                // ── 3. TABLA RESUMEN ──
                const tbody = document.getElementById('tabla-body');
                tbody.innerHTML = '';
                data.labels.forEach((label, i) => {
                    const vC = data.canterano.valores[i];
                    const vP = data.profesional.valores[i];
                    const diff = vC - vP;
                    const diffAbs = Math.abs(diff);

                    let diffClass, diffText, tdCanClass = '', tdProfClass = '';
                    if (diff === 0) {
                        diffClass = 'diff-empate'; diffText = '=';
                    } else if (diff > 0) {
                        diffClass = 'diff-canton-gana'; diffText = `+${diffAbs}`; tdCanClass = 'celda-ganador';
                    } else {
                        diffClass = 'diff-prof-gana'; diffText = `-${diffAbs}`; tdProfClass = 'celda-ganador';
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="label-metrica">${label}</td>
                        <td class="${tdCanClass}">${vC}</td>
                        <td class="celda-diff ${diffClass}">${diffText}</td>
                        <td class="${tdProfClass}">${vP}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Error:", error);
                alert("No se pudo cargar el gráfico.");
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        new TomSelect("#select-profesional", {
            maxItems: 1,
            hideSelected: true,
            allowEmptyOption: true,
            valueField: 'player',
            labelField: 'display_name',
            searchField: 'player',
            plugins: ['remove_button'],
            load: async function(query, callback) {
                if (query.length < 3) return callback();
                try {
                    const response = await fetch(`/buscar_profesionales?nombre=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    callback(data.map(p => ({ player: p.player, display_name: `${p.player} (${p.team})` })));
                } catch (error) {
                    console.error("Error cargando profesionales:", error);
                    callback();
                }
            },
            render: {
                option: function(item, escape) {
                    return `<div class="py-2">
                        <div style="font-weight:bold;color:white;">${escape(item.player)}</div>
                        <small style="color:#94a3b8;">${escape(item.display_name)}</small>
                    </div>`;
                },
                item: function(item, escape) {
                    return `<div style="color:white;">${escape(item.display_name)}</div>`;
                }
            },
            onItemAdd: function() { this.blur(); }
        });
    </script>
</body>
</html>
