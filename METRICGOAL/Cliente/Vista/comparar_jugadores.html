<!DOCTYPE html>

<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar Jugadores - METRICGOAL</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <style>
        /* Ajuste para que el buscador combine con tu estilo oscuro */
        .ts-control {
            background-color: #1e293b !important;
            color: white !important;
            border: 1px solid #334155 !important;
        }
        .ts-dropdown {
            background-color: #1e293b !important;
            color: white !important;
        }
        .ts-dropdown .active {
            background-color: #800020 !important;
            color: white !important;
        }
    </style>
</head>
<body class="comparar-page">

    <header>
        <div class="logo">MG</div>
        <nav>
            <a href="/dashboard">Mi Equipo</a>
            <a href="/informes">Informes</a>
            <a href="/comparar_jugadores" class="active">Comparar Jugadores</a>
        </nav>
        <button class="btn-salir" onclick="logout()">Cerrar Sesión</button>
    </header>

    <main class="container">
        
        <section class="controles-comparacion">
            <div class="control-grupo">
                <label for="select-canterano">Selecciona al canterano</label>
                <select id="select-canterano" placeholder="Escribe para buscar...">
                    <option value="">Seleccionar...</option>
                </select>
            </div>

            <div class="control-grupo">
                <label for="select-profesional">Busca al profesional</label>
                <select id="select-profesional" placeholder="Escribe para buscar (ej: Lewandowski, Mbappe...)"></select>
            </div>
        </section>

        <button class="btn-exportar" onclick="realizarComparacion()">Comparar Jugadores</button>

        <section class="metricas-grid" style="display: flex; justify-content: center; align-items: center; width: 100%;">
            <div class="caja-metrica" style="grid-column: span 3; width: 100%; max-width: 900px; min-height: 550px; display: flex; flex-direction: column; align-items: center;">
                
                <div id="grafico-radar" style="width: 100%; height: 500px; z-index: 1;"></div>
            </div>
        </section>

    </main>

    <script>
        // ... (tus funciones cargarJugadoresSelect y la inicialización de TomSelect iguales)

        async function realizarComparacion() {
            const idCanterano = document.getElementById('select-canterano').value;
            const nombreProfesional = document.getElementById('select-profesional').value;
            
            if(!idCanterano || !nombreProfesional) {
                alert("Selecciona ambos jugadores.");
                return;
            }

            try {
                // Usamos la ruta de la API que definimos antes
                const response = await fetch(`/api/comparar_jugadores?id_canterano=${idCanterano}&nombre_profesional=${encodeURIComponent(nombreProfesional)}`);
                
                if (!response.ok) throw new Error("Error en la respuesta del servidor");

                const data = await response.json();
                if (data.error) {
                    alert("Error: " + data.error);
                    return;
                }

                // 3. Pintar el gráfico con Hover Inteligente
                const traceCanterano = {
                    type: 'scatterpolar',
                    r: data.canterano.valores,
                    theta: data.labels,
                    fill: 'toself',
                    name: data.canterano.nombre,
                    // HOVER INTUITIVO: Muestra "Nombre: Valor"
                    hovertemplate: `<b>${data.canterano.nombre}</b><br>%{theta}: <b>%{r}</b><extra></extra>`,
                    line: { color: '#3b82f6', width: 3 }, 
                    fillcolor: 'rgba(59, 130, 246, 0.3)'
                };

                const traceProfesional = {
                    type: 'scatterpolar',
                    r: data.profesional.valores,
                    theta: data.labels,
                    fill: 'toself',
                    name: data.profesional.nombre,
                    hovertemplate: `<b>${data.profesional.nombre}</b><br>%{theta}: <b>%{r}</b><extra></extra>`,
                    line: { color: '#800020', width: 3 }, 
                    fillcolor: 'rgba(128, 0, 32, 0.3)'
                };

                const layout = {
                    autosize: true,
                    hovermode: 'closest', // Hace que el hover sea más sensible
                    polar: {
                        radialaxis: { 
                            visible: false, // Limpio, sin números 'r' emborronando
                        },
                        angularaxis: { 
                            tickfont: { size: 13, color: "white", family: "Arial" },
                            gridcolor: "rgba(255,255,255,0.1)" 
                        },
                        bgcolor: "rgba(30, 41, 59, 0.5)"
                    },
                    margin: { l: 60, r: 60, t: 40, b: 40 },
                    paper_bgcolor: "rgba(0,0,0,0)",
                    plot_bgcolor: "rgba(0,0,0,0)",
                    showlegend: true,
                    legend: {
                        orientation: "h",
                        y: -0.15,
                        x: 0.5,
                        xanchor: "center",
                        font: { color: "white" }
                    }
                };

                Plotly.newPlot('grafico-radar', [traceCanterano, traceProfesional], layout, {responsive: true});

            } catch (error) {
                console.error("Error al comparar:", error);
                alert("No se pudo realizar la comparación.");
            }
        }
    </script>

    <script>
        let buscador;

        // Al cargar la página, recuperamos los datos
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Inicializamos el buscador visual
            buscador = new TomSelect("#select-canterano", {
                create: false,
                sortField: { field: "text", order: "asc" }
            });

            // 2. Cargamos los jugadores reales de tu DB
            await cargarJugadoresSelect();
        });

        async function cargarJugadoresSelect() {
            const idEquipo = localStorage.getItem('idEquipo');
            if (!idEquipo) return;

            try {
                const response = await fetch(`/obtener_jugadores?id_equipo=${idEquipo}`);
                const jugadores = await response.json();

                // Añadimos cada jugador al buscador
                jugadores.forEach(j => {
                    buscador.addOption({
                        value: j.id_jugador,
                        text: `${j.nombre} ${j.apellidos || ''} (${j.posicion})`
                    });
                });
            } catch (error) {
                console.error("Error al cargar jugadores:", error);
            }
        }

        async function realizarComparacion() {
            const idCanterano = document.getElementById('select-canterano').value;
            const nombreProfesional = document.getElementById('select-profesional').value;

            if (!idCanterano || !nombreProfesional) {
                alert("Por favor, selecciona ambos jugadores");
                return;
            }

            try {
                const response = await fetch(`/api/comparar_jugadores?id_canterano=${idCanterano}&nombre_profesional=${encodeURIComponent(nombreProfesional)}`);
                const data = await response.json();

                if (data.error) {
                    alert("Error: " + data.error);
                    return;
                }

                // --- PASO 1: NORMALIZACIÓN INDIVIDUAL POR MÉTRICA ---
                // Esto hace que el mejor de los dos en cada estadística siempre toque el borde (100)
                const valoresVisualesCanterano = [];
                const valoresVisualesProfesional = [];

                data.labels.forEach((label, i) => {
                    const vCan = data.canterano.valores[i];
                    const vProf = data.profesional.valores[i];
                    const maxMetrica = Math.max(vCan, vProf);

                    if (maxMetrica > 0) {
                        // El que más tiene llega a 100, el otro se queda proporcional
                        valoresVisualesCanterano.push((vCan / maxMetrica) * 100);
                        valoresVisualesProfesional.push((vProf / maxMetrica) * 100);
                    } else {
                        valoresVisualesCanterano.push(0);
                        valoresVisualesProfesional.push(0);
                    }
                });

                // --- PASO 2: CONFIGURACIÓN DE TRACES ---
                const traceCanterano = {
                    type: 'scatterpolar',
                    r: valoresVisualesCanterano, // Usamos el valor 0-100 para el dibujo
                    theta: data.labels,
                    fill: 'toself',
                    name: data.canterano.nombre,
                    // Mostramos el valor real (customdata) en el cartelito
                    customdata: data.canterano.valores, 
                    hovertemplate: `<b>${data.canterano.nombre}</b><br>%{theta}: <b>%{customdata}</b><extra></extra>`,
                    line: { color: '#3b82f6', width: 3 },
                    fillcolor: 'rgba(59, 130, 246, 0.3)'
                };

                const traceProfesional = {
                    type: 'scatterpolar',
                    r: valoresVisualesProfesional, // Usamos el valor 0-100 para el dibujo
                    theta: data.labels,
                    fill: 'toself',
                    name: data.profesional.nombre,
                    customdata: data.profesional.valores,
                    hovertemplate: `<b>${data.profesional.nombre}</b><br>%{theta}: <b>%{customdata}</b><extra></extra>`,
                    line: { color: '#800020', width: 3 },
                    fillcolor: 'rgba(128, 0, 32, 0.3)'
                };

                // --- PASO 3: LAYOUT CON RANGO FIJO 0-100 ---
                const layout = {
                    polar: {
                        radialaxis: {
                            visible: true,
                            showticklabels: false,
                            gridcolor: "rgba(255,255,255,0.1)",
                            range: [0, 105] // 105 para que el punto no toque el borde blanco exacto
                        },
                        angularaxis: {
                            gridcolor: "#334155",
                            color: "white",
                            tickfont: { size: 12 },
                            rotation: 90 // Opcional: para que la primera métrica salga arriba
                        },
                        bgcolor: "rgba(30, 41, 59, 0.5)"
                    },
                    hovermode: 'closest',
                    paper_bgcolor: "rgba(0,0,0,0)",
                    plot_bgcolor: "rgba(0,0,0,0)",
                    font: { color: "white" },
                    showlegend: true,
                    legend: {
                        orientation: "h",
                        y: -0.2,
                        x: 0.5,
                        xanchor: "center"
                    },
                    margin: { t: 40, b: 40, l: 80, r: 80 }
                };

                Plotly.newPlot('grafico-radar', [traceCanterano, traceProfesional], layout, {responsive: true});

            } catch (error) {
                console.error("Error:", error);
                alert("No se pudo cargar el gráfico.");
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        // Configuración para el buscador de PROFESIONALES (2777 jugadores)
        new TomSelect("#select-profesional", {
            maxItems: 1,
            hideSelected: true,
            allowEmptyOption: true,
            valueField: 'player',
            labelField: 'display_name',
            searchField: 'player',
            // Añadimos este plugin para que sea fácil borrar al jugador seleccionado
            plugins: ['remove_button'],
            load: async function(query, callback) {
                if (query.length < 3) return callback();
                
                try {
                    const response = await fetch(`/buscar_profesionales?nombre=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    
                    const options = data.map(p => ({
                        player: p.player,
                        display_name: `${p.player} (${p.team})`
                    }));
                    
                    callback(options);
                } catch (error) {
                    console.error("Error cargando profesionales:", error);
                    callback();
                }
            },
            render: {
                option: function(item, escape) {
                    return `<div class="py-2">
                                <div style="font-weight: bold; color: white;">${escape(item.player)}</div>
                                <small style="color: #94a3b8;">${escape(item.display_name)}</small>
                            </div>`;
                },
                item: function(item, escape) {
                    // Esto es lo que se ve dentro de la caja al seleccionar
                    return `<div style="color: white;">${escape(item.display_name)}</div>`;
                }
            },
            // Agrupamos los eventos correctamente
            onItemAdd: function() {
                this.blur(); // Cierra el teclado/foco al seleccionar
            }
        });
    </script>
</body>
</html>
