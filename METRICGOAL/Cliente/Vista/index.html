<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - METRICGOAL</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="/static/transparent-logo.ico" />
</head>

<body class="login-page">

    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">MG</div>
            <h1>METRIC<span>GOAL</span></h1>
            <p>Gestión y Analítica Deportiva</p>
        </div>

        <hr class="login-divider">

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="entrenador@metricgoal.com" required>
                    <span class="input-icon">✉️</span>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <span class="input-icon">🔒</span>
                </div>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>

            <div id="errorMessage" class="error-message"></div>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorDisplay = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorDisplay.style.display = 'none';
            errorDisplay.textContent = '';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('usuarioNombre', result.nombre);
                    localStorage.setItem('usuarioClub', result.club);
                    localStorage.setItem('usuarioEquipo', result.equipo);
                    localStorage.setItem('idEquipo', result.id_equipo);
                    window.location.href = '/dashboard';
                } else {
                    errorDisplay.textContent = result.detail || "Credenciales incorrectas";
                    errorDisplay.style.display = 'block';
                }
            } catch (error) {
                errorDisplay.textContent = "🔌 Error: El servidor no responde.";
                errorDisplay.style.display = 'block';
            }
        });
    </script>
</body>
</html>
