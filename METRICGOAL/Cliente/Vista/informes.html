<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informes - METRICGOAL</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="/static/transparent-logo.ico" />
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <script src="/static/js/informes.js" defer></script>
</head>
<body class="informes-page">

    <div id="modal-informe">
        <div class="modal-panel" id="modal-panel-inner"></div>
    </div>

    <header>
        <div class="logo">MG</div>
        <div class="header-sep"></div>
        <nav>
            <a href="/dashboard">Mi Equipo</a>
            <a href="/informes" class="active">Informes</a>
            <a href="/comparar_jugadores">Comparar Jugadores</a>
        </nav>
        <div class="header-right">
            <span class="badge-temporada">2025/26</span>
            <button class="btn-salir" onclick="logout()">Cerrar Sesión</button>
        </div>
    </header>

    <main class="container">
        <section class="destacados-section">
            <div class="tarjeta-destacado" id="card-goleador">
                <h3>Máximo Goleador</h3>
                <div class="info-jugador">
                    <p class="nombre-jugador">Cargando...</p>
                    <p class="dato-estadistico">-</p>
                </div>
            </div>
            <div class="tarjeta-destacado" id="card-asistente">
                <h3>Máximo Asistente</h3>
                <div class="info-jugador">
                    <p class="nombre-jugador">Cargando...</p>
                    <p class="dato-estadistico">-</p>
                </div>
            </div>
        </section>

        <section class="seccion-informes-guardados">
            <h2>📁 Informes Guardados</h2>
            <div class="grid-informes-guardados" id="grid-informes-guardados"></div>
        </section>
    </main>

    <div id="toast-informes"></div>
</body>
</html>
